name: 'nyc_transform'
version: '1.0.0'
profile: 'nyc_transform'

# ---------------------------------------------------------------------------
# Path configuration
# ---------------------------------------------------------------------------
model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------------
# Model materialisation strategy
#
# staging models  → incremental (partition-pruned on created_at)
# mart models     → table (small pre-aggregation, refreshed every run)
# ---------------------------------------------------------------------------
models:
  nyc_transform:
    staging:
      +materialized: incremental
      +incremental_strategy: merge
      +unique_key: complaint_id
      +partition_by:
        field: created_at
        data_type: timestamp
        granularity: day
      +cluster_by: ["agency"]
    marts:
      +materialized: table
