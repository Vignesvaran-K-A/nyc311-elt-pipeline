nyc_transform:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: silver_layer
      threads: 4
      keyfile: "{{ env_var('DBT_KEYFILE', env_var('GOOGLE_APPLICATION_CREDENTIALS', '/secrets/gcp.json')) }}"
      location: US